	<path
		d="M 16 18 L 48 18 L 48 25 L 45.2 25 C 44.2 21.8 42.2 21 38.5 21 L 35.5 21 L 35.5 45 C 35.5 47.6 36.6 48.6 39.5 49 L 39.5 51 L 24.5 51 L 24.5 49 C 27.4 48.6 28.5 47.6 28.5 45 L 28.5 21 L 25.5 21 C 21.8 21 19.8 21.8 18.8 25 L 16 25 Z"
		fill="url(#admin-gold)"
	/>

	<!-- Corner Diamond Badge for Admin -->
	<polygon points="32,9.5 34.8,12.8 32,16.1 29.2,12.8" fill="#f0ca85" />
