<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
	<defs>
		<radialGradient id="admin-bg" cx="50%" cy="35%" r="70%">
			<stop offset="0%" stop-color="#3a121b" />
			<stop offset="65%" stop-color="#17080b" />
			<stop offset="100%" stop-color="#080506" />
		</radialGradient>
		<linearGradient id="admin-gold" x1="12%" y1="8%" x2="88%" y2="92%">
			<stop offset="0%" stop-color="#fff0cc" />
			<stop offset="45%" stop-color="#e4b86a" />
			<stop offset="100%" stop-color="#a8742c" />
		</linearGradient>
	</defs>

	<!-- Deep Burgundy-Obsidian Crest Background (Admin Distinction) -->
